services:
  # ── FastAPI Backend Web Service ─────────────────────────────────────────────
  - type: web
    name: vector-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: "*"
      # Connect to Ollama via ngrok, Cloudflare tunnel, or remote server
      # (e.g. https://your-tunnel.ngrok-free.app)
      - key: OLLAMA_URL
        value: "http://127.0.0.1:11434"
      - key: DEFAULT_MODEL
        value: "gemma4:e4b"
      - key: LIGHT_MODEL
        value: "gemma4:e2b"
      - key: DEEP_MODEL
        value: "qwen2.5-coder:7b"
      - key: NUM_CTX
        value: "4096"

  # ── Vite / React Frontend Static Site ───────────────────────────────────────
  - type: web
    name: vector-frontend
    runtime: static
    buildCommand: npm install && VITE_API_URL="https://${BACKEND_HOST}" npm run build
    staticPublishPath: .output/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BACKEND_HOST
        fromService:
          type: web
          name: vector-backend
          property: host
